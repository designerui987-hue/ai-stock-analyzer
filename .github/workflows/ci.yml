name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci_suite
      TOKEN_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      ALLOWED_ORIGINS: http://localhost:3000
      CRON_SECRET: test_cron_secret_for_ci_pipeline
      DEMO_MODE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx greenlet

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

  frontend-check:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stock_analyzer
      NEXTAUTH_SECRET: test_nextauth_secret_minimum_32_chars_for_ci
      NEXTAUTH_URL: http://localhost:3000
      TOKEN_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: test_cron_secret_for_ci_pipeline
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        run: |
          npx tsx lib/signal-resolution.test.ts
          npx tsx lib/auth-lockdown.test.ts

      - name: Build Next.js Production Bundle
        run: npm run build

